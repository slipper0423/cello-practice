<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的大提琴紀錄 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #fdfaf5; color: #4a3728; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee5d8; font-size: 0.8rem; background: white; position: relative; }
        .day-active { background-color: #e9e4bc !important; color: #6d664d !important; border-color: #dad4a2 !important; }
        .day-lesson { background-color: #a8ad8d !important; color: white !important; border-color: #8e9475 !important; }
        .wood-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(61,43,31,0.1); border: 1px solid #e0d5c1; }
        .book-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }
        
        /* 調色盤選單樣式修正 */
        #colorMenu { 
            display: none; position: absolute; background: white; border: 1px solid #e0d5c1; 
            padding: 10px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            z-index: 100; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .color-picker-item { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
        .color-picker-item:hover { transform: scale(1.1); border-color: #ddd; }
        
        .book-name-clickable { cursor: pointer; border-bottom: 1px dashed transparent; }
        .book-name-clickable:hover { opacity: 0.7; }
        .palette-trigger { cursor: pointer; color: #a89a8e; transition: 0.2s; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto pb-20">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">2025 總累積時數</div>
                <div id="statTotalHours" class="text-3xl font-bold text-amber-900">0.0h</div>
            </div>
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">累積上課次數</div>
                <div id="statTotalLessons" class="text-3xl font-bold text-amber-900">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 wood-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendarTitle" class="text-xl font-bold">2025年 1月</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid mb-2 text-center text-xs text-gray-400 font-bold">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendarBody" class="calendar-grid"></div>
            </div>

            <div class="wood-card p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fa-solid fa-book-bookmark mr-2"></i>教材使用紀錄</h2>
                <div class="space-y-3 mb-6 relative">
                    <div class="flex gap-2 items-center">
                        <input type="text" id="newBookName" placeholder="教材名稱..." class="flex-1 border-b p-1 text-sm outline-none bg-transparent">
                        <div class="palette-trigger" onclick="openPalette(event, 'new')"><i class="fa-solid fa-palette text-lg"></i></div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] text-gray-400">預設新增日期</label>
                        <input type="date" id="newBookStart" class="text-xs border rounded p-1">
                        <button onclick="addBook()" class="bg-stone-700 text-white px-4 py-2 rounded text-sm mt-1 hover:bg-stone-600 font-bold">新增教材</button>
                    </div>
                    <div id="colorMenu"></div>
                </div>
                
                <ul id="bookList" class="space-y-3"></ul>
                <div class="mt-4 text-center">
                    <button id="toggleBookListBtn" onclick="toggleBookList()" class="text-[11px] text-stone-500 border px-3 py-1 rounded-full hidden">展開全部教材</button>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <button onclick="exportData()" class="border border-amber-900 text-amber-900 px-4 py-2 rounded-lg text-sm font-bold">匯出備份</button>
            <button onclick="document.getElementById('importFile').click()" class="ml-2 border border-gray-400 text-gray-600 px-4 py-2 rounded-lg text-sm font-bold">匯入備份</button>
            <input type="file" id="importFile" class="hidden" onchange="importData(event)">
        </div>
    </div>

    <div id="logModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalDate" class="text-lg font-bold mb-4 text-amber-900 underline">日期</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">練習教材</label>
                    <select id="logBookSelect" class="w-full border-b p-2 text-sm outline-none bg-transparent"></select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">練習分鐘</label>
                    <input type="number" id="logMinutes" value="60" class="w-full border-b p-2 text-xl font-bold outline-none">
                </div>
                <div class="flex items-center"><input type="checkbox" id="logIsLesson" class="mr-2"> <span class="text-sm">今日有上課</span></div>
                <button onclick="saveEntry()" class="w-full bg-amber-900 text-white py-3 rounded-lg shadow-lg font-bold">儲存</button>
                <button id="deleteBtn" onclick="deleteEntry()" class="w-full text-red-500 text-xs mt-2 hidden">刪除紀錄</button>
            </div>
        </div>
    </div>

    <div id="bookDateModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <h3 id="dateModalTitle" class="text-lg font-bold mb-4 text-amber-900">設定日期</h3>
            <input type="date" id="dateModalInput" class="w-full border p-2 mb-4 rounded">
            <div class="flex gap-2">
                <button onclick="confirmBookDate()" class="flex-1 bg-stone-700 text-white py-2 rounded font-bold">確定</button>
                <button onclick="closeBookDateModal()" class="flex-1 border py-2 rounded font-bold">取消</button>
            </div>
        </div>
    </div>

    <script>
        const morandiColors = ['#a36361', '#b38e7d', '#e0c388', '#98a386', '#8eabb3', '#a199ad', '#b0a896', '#bac9b8', '#8a8a8a'];
        let db = JSON.parse(localStorage.getItem('celloPureLogDB')) || { logs: {}, books: [] };
        let currentViewDate = new Date(2025, 0, 1), selectedColor = morandiColors[0], colorTarget = 'new';
        let isBookListExpanded = false, pendingBookIndex = null, dateMode = "", selectedDateStr = "";

        // 生成調色盤內容
        const menu = document.getElementById('colorMenu');
        morandiColors.forEach(c => {
            const item = document.createElement('div');
            item.className = 'color-picker-item';
            item.style.background = c;
            item.onclick = () => {
                if(colorTarget === 'new') {
                    selectedColor = c;
                    document.getElementById('newBookName').style.color = c;
                } else {
                    db.books[colorTarget].color = c;
                    saveDB(); updateStats();
                }
                menu.style.display = 'none';
            };
            menu.appendChild(item);
        });

        function openPalette(e, target) {
            e.stopPropagation();
            colorTarget = target;
            const rect = e.currentTarget.getBoundingClientRect();
            menu.style.top = (window.scrollY + rect.bottom + 5) + 'px';
            menu.style.left = (window.scrollX + rect.left - 60) + 'px';
            menu.style.display = menu.style.display === 'grid' ? 'none' : 'grid';
        }

        document.addEventListener('click', () => menu.style.display = 'none');

        // 排序功能
        Sortable.create(document.getElementById('bookList'), {
            animation: 150,
            onEnd: (evt) => {
                const item = db.books.splice(evt.oldIndex, 1)[0];
                db.books.splice(evt.newIndex, 0, item);
                saveDB(); updateStats();
            },
        });

        function updateStats() {
            let mins = 0, lessons = 0;
            Object.values(db.logs).forEach(e => { mins += e.mins; if (e.isLesson) lessons++; });
            document.getElementById('statTotalHours').innerText = (mins / 60).toFixed(1) + 'h';
            document.getElementById('statTotalLessons').innerText = lessons;

            const list = document.getElementById('bookList'), select = document.getElementById('logBookSelect'), toggleBtn = document.getElementById('toggleBookListBtn');
            list.innerHTML = ''; select.innerHTML = '<option value="">未選擇教材</option>';

            if (db.books.length > 3) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.innerText = isBookListExpanded ? "收起教材列表" : "展開全部教材";
            } else { toggleBtn.classList.add('hidden'); isBookListExpanded = true; }

            db.books.forEach((b, i) => {
                const li = document.createElement('li');
                li.className = `book-item p-3 bg-stone-50 rounded-lg border border-stone-200 ${(!isBookListExpanded && i >= 3) ? 'hidden' : ''}`;
                li.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="book-name-clickable text-[13px] font-bold leading-tight" style="color: ${b.color}" onclick="openPalette(event, ${i})">${b.name}</span>
                        <button onclick="deleteBook(${i})" class="text-[11px] text-gray-300">刪除</button>
                    </div>
                    <div class="text-[11px] text-gray-500">
                        開始：${b.start || '無'} <button onclick="openDateModal(${i}, 'start')" class="ml-1 underline italic opacity-50">修改</button><br>
                        結束：${b.end || '學習中'} 
                        <button onclick="openDateModal(${i}, 'end')" class="ml-1 underline font-bold text-stone-600">${b.end ? '修改' : '設定完練'}</button>
                    </div>`;
                list.appendChild(li);
                const opt = document.createElement('option');
                opt.value = b.name; opt.innerText = b.name; select.appendChild(opt);
            });
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
            document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            const body = document.getElementById('calendarBody'); body.innerHTML = '';
            for (let i = 0; i < firstDay; i++) body.innerHTML += '<div></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const log = db.logs[ds];
                const cell = document.createElement('div');
                cell.className = `day-cell ${log ? (log.isLesson ? "day-lesson" : "day-active") : ""}`;
                let dot = "";
                if (log && log.bookName) {
                    const b = db.books.find(x => x.name === log.bookName);
                    if (b) dot = `<div class="book-dot" style="background: ${b.color}"></div>`;
                }
                cell.innerHTML = `<span>${d}</span>${dot}${log ? `<span class="text-[8px] opacity-70">${log.mins}m</span>` : ''}`;
                cell.onclick = () => {
                    selectedDateStr = ds; document.getElementById('modalDate').innerText = ds;
                    document.getElementById('logMinutes').value = log ? log.mins : 60;
                    document.getElementById('logIsLesson').checked = log ? log.isLesson : false;
                    document.getElementById('logBookSelect').value = (log && log.bookName) ? log.bookName : "";
                    document.getElementById('deleteBtn').classList.toggle('hidden', !log);
                    document.getElementById('logModal').style.display = 'flex';
                };
                body.appendChild(cell);
            }
        }

        function saveEntry() {
            db.logs[selectedDateStr] = { mins: parseInt(document.getElementById('logMinutes').value) || 0, isLesson: document.getElementById('logIsLesson').checked, bookName: document.getElementById('logBookSelect').value };
            saveDB(); closeModal(); updateStats();
        }

        function addBook() {
            const n = document.getElementById('newBookName').value, s = document.getElementById('newBookStart').value;
            if (n) { db.books.unshift({ name: n, start: s, end: null, color: selectedColor }); saveDB(); updateStats(); document.getElementById('newBookName').value = ''; }
        }

        function openDateModal(i, m) {
            pendingBookIndex = i; dateMode = m;
            document.getElementById('dateModalInput').value = m === 'start' ? (db.books[i].start || '') : (db.books[i].end || '');
            document.getElementById('bookDateModal').style.display = 'flex';
        }

        function confirmBookDate() {
            const d = document.getElementById('dateModalInput').value;
            if (dateMode === 'start') db.books[pendingBookIndex].start = d; else db.books[pendingBookIndex].end = d;
            saveDB(); updateStats(); closeBookDateModal();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'cello_backup.json'; a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (f) => { db = JSON.parse(f.target.result); saveDB(); updateStats(); };
            reader.readAsText(e.target.files[0]);
        }

        function closeBookDateModal() { document.getElementById('bookDateModal').style.display = 'none'; }
        function closeModal() { document.getElementById('logModal').style.display = 'none'; }
        function deleteBook(i) { if (confirm("刪除教材？")) { db.books.splice(i, 1); saveDB(); updateStats(); } }
        function saveDB() { localStorage.setItem('celloPureLogDB', JSON.stringify(db)); }
        function deleteEntry() { delete db.logs[selectedDateStr]; saveDB(); closeModal(); updateStats(); }
        function changeMonth(s) { currentViewDate.setMonth(currentViewDate.getMonth() + s); renderCalendar(); }
        function toggleBookList() { isBookListExpanded = !isBookListExpanded; updateStats(); }

        document.getElementById('newBookStart').value = new Date().toISOString().split('T')[0];
        updateStats();
    </script>
</body>
</html>
