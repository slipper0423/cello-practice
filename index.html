<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大提琴紀錄 2025 - 精緻選色版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #fdfaf5; color: #4a3728; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee5d8; font-size: 0.8rem; background: white; position: relative; }
        .day-active { background-color: #e9e4bc !important; color: #6d664d !important; border-color: #dad4a2 !important; }
        .day-lesson { background-color: #a8ad8d !important; color: white !important; border-color: #8e9475 !important; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .wood-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(61,43,31,0.1); border: 1px solid #e0d5c1; }
        
        /* 教材圓點 (行事曆用) */
        .book-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }
        
        /* 調色盤選單樣式 */
        #paletteMenu { 
            display: none; position: absolute; background: white; border: 1px solid #e0d5c1; 
            padding: 12px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            z-index: 100; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .color-circle { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; transition: transform 0.1s; border: 2px solid transparent; }
        .color-circle:hover { transform: scale(1.1); border-color: #ddd; }

        .book-name-clickable { cursor: pointer; border-bottom: 1px dashed transparent; transition: 0.2s; }
        .book-name-clickable:hover { border-bottom-color: currentColor; opacity: 0.8; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto pb-20">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 wood-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendarTitle" class="text-xl font-bold">2025年 1月</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div id="calendarBody" class="calendar-grid"></div>
            </div>

            <div class="wood-card p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fa-solid fa-book-bookmark mr-2"></i>教材使用紀錄</h2>
                
                <div class="space-y-3 mb-6 relative">
                    <div class="flex gap-2 items-center">
                        <input type="text" id="newBookName" placeholder="教材名稱..." class="flex-1 border-b p-1 text-sm outline-none bg-transparent">
                        <div class="cursor-pointer text-stone-400 hover:text-stone-700" onclick="togglePalette(event, 'new')">
                            <i class="fa-solid fa-palette text-xl"></i>
                        </div>
                    </div>
                    <input type="date" id="newBookStart" class="w-full text-xs border rounded p-1">
                    <button onclick="addBook()" class="w-full bg-stone-700 text-white py-2 rounded text-sm hover:bg-stone-600 transition font-bold">新增教材</button>
                    
                    <div id="paletteMenu">
                        </div>
                </div>
                
                <ul id="bookList" class="space-y-3"></ul>
                
                <div class="mt-4 text-center">
                    <button id="toggleBookListBtn" onclick="toggleBookList()" class="text-[11px] text-stone-500 hover:text-stone-800 hidden border px-3 py-1 rounded-full">展開全部教材</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bookDateModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <h3 id="dateModalTitle" class="text-lg font-bold mb-4 text-amber-900">設定日期</h3>
            <input type="date" id="dateModalInput" class="w-full border p-2 mb-4 rounded">
            <div class="flex gap-2">
                <button onclick="confirmBookDate()" class="flex-1 bg-stone-700 text-white py-2 rounded font-bold">確定</button>
                <button onclick="closeBookDateModal()" class="flex-1 border py-2 rounded font-bold">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 定義高辨識度的 9 個顏色 (參考圖二)
        const morandiColors = [
            '#a36361', '#b38e7d', '#e0c388', 
            '#98a386', '#8eabb3', '#a199ad', 
            '#b0a896', '#bac9b8', '#8a8a8a'
        ];

        let db = JSON.parse(localStorage.getItem('celloPureLogDB')) || { logs: {}, books: [] };
        let currentViewDate = new Date(2025, 0, 1);
        let selectedColor = morandiColors[0];
        let isBookListExpanded = false;
        let pendingBookIndex = null;
        let dateMode = "";
        let colorTarget = 'new'; // 'new' 或 教材索引

        // 初始化調色盤內容
        const paletteMenu = document.getElementById('paletteMenu');
        morandiColors.forEach(color => {
            const div = document.createElement('div');
            div.className = 'color-circle';
            div.style.background = color;
            div.onclick = () => selectColor(color);
            paletteMenu.appendChild(div);
        });

        function togglePalette(event, target) {
            event.stopPropagation();
            colorTarget = target;
            const rect = event.currentTarget.getBoundingClientRect();
            paletteMenu.style.top = (window.scrollY + rect.bottom + 5) + 'px';
            paletteMenu.style.left = (window.scrollX + rect.left - 80) + 'px';
            paletteMenu.style.display = paletteMenu.style.display === 'grid' ? 'none' : 'grid';
        }

        function selectColor(color) {
            if (colorTarget === 'new') {
                selectedColor = color;
                document.getElementById('newBookName').style.color = color;
            } else {
                db.books[colorTarget].color = color;
                saveDB();
                updateStats();
            }
            paletteMenu.style.display = 'none';
        }

        // 點擊外面關閉調色盤
        document.addEventListener('click', () => { paletteMenu.style.display = 'none'; });

        function updateStats() {
            const list = document.getElementById('bookList');
            const toggleBtn = document.getElementById('toggleBookListBtn');
            list.innerHTML = '';

            if (db.books.length > 3) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.innerText = isBookListExpanded ? "收起教材列表" : "展開全部教材";
            } else { toggleBtn.classList.add('hidden'); isBookListExpanded = true; }

            db.books.forEach((b, i) => {
                const li = document.createElement('li');
                li.className = `book-item p-3 bg-stone-50 rounded-lg border border-stone-200 ${(!isBookListExpanded && i >= 3) ? 'hidden' : ''}`;
                li.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="book-name-clickable text-[14px] font-bold" 
                              style="color: ${b.color}" 
                              onclick="togglePalette(event, ${i})">${b.name}</span>
                        <button onclick="deleteBook(${i})" class="text-[11px] text-gray-400">刪除</button>
                    </div>
                    <div class="text-[11px] text-gray-500 leading-relaxed">
                        開始：${b.start || '---'} <button onclick="openDateModal(${i}, 'start')" class="ml-1 underline italic opacity-60">修改</button><br>
                        結束：${b.end || '學習中'} 
                        <button onclick="openDateModal(${i}, 'end')" class="ml-1 underline font-bold text-stone-600">${b.end ? '修改' : '設定完練'}</button>
                    </div>
                `;
                list.appendChild(li);
            });
            renderCalendar();
        }

        function addBook() {
            const name = document.getElementById('newBookName').value;
            const start = document.getElementById('newBookStart').value;
            if (name) { 
                db.books.unshift({ name, start, end: null, color: selectedColor }); 
                saveDB(); 
                document.getElementById('newBookName').value = '';
                updateStats(); 
            }
        }

        function renderCalendar() {
            const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
            document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            const body = document.getElementById('calendarBody');
            body.innerHTML = '';
            for (let i = 0; i < firstDay; i++) body.innerHTML += '<div></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const log = db.logs[dateStr];
                const dayEl = document.createElement('div');
                dayEl.className = `day-cell ${log ? (log.isLesson ? "day-lesson" : "day-active") : ""}`;
                
                let dotHtml = "";
                if (log && log.bookName) {
                    const book = db.books.find(b => b.name === log.bookName);
                    if (book) dotHtml = `<div class="book-dot" style="background: ${book.color}"></div>`;
                }
                dayEl.innerHTML = `<span>${d}</span>${dotHtml}`;
                body.appendChild(dayEl);
            }
        }

        // 其他基礎邏輯
        function openDateModal(i, mode) { pendingBookIndex = i; dateMode = mode; document.getElementById('bookDateModal').style.display = 'flex'; }
        function closeBookDateModal() { document.getElementById('bookDateModal').style.display = 'none'; }
        function confirmBookDate() {
            const date = document.getElementById('dateModalInput').value;
            if (dateMode === 'start') db.books[pendingBookIndex].start = date;
            else db.books[pendingBookIndex].end = date;
            saveDB(); updateStats(); closeBookDateModal();
        }
        function saveDB() { localStorage.setItem('celloPureLogDB', JSON.stringify(db)); }
        function toggleBookList() { isBookListExpanded = !isBookListExpanded; updateStats(); }
        function deleteBook(i) { if(confirm("確定刪除此教材？")) { db.books.splice(i, 1); saveDB(); updateStats(); } }
        function changeMonth(s) { currentViewDate.setMonth(currentViewDate.getMonth() + s); renderCalendar(); }

        updateStats();
    </script>
</body>
</html>
