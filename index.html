<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的大提琴紀錄 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #fdfaf5; color: #4a3728; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee5d8; font-size: 0.8rem; background: white; }
        .day-cell:hover { background-color: #f3e5d0; }
        .day-active { background-color: #8b4513 !important; color: white; }
        .day-lesson { border: 2px solid #d32f2f !important; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .wood-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(61,43,31,0.1); border: 1px solid #e0d5c1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">2025 總累積時數</div>
                <div id="statTotalHours" class="text-3xl font-bold text-amber-900">0.0h</div>
            </div>
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">累積上課次數</div>
                <div id="statTotalLessons" class="text-3xl font-bold text-red-700">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 wood-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendarTitle" class="text-xl font-bold">2025年 1月</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid mb-2 text-center text-xs text-gray-400 font-bold">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendarBody" class="calendar-grid"></div>
                <div class="mt-4 flex gap-4 text-xs">
                    <div class="flex items-center"><div class="w-3 h-3 bg-[#8b4513] mr-1 rounded"></div> 有練琴</div>
                    <div class="flex items-center"><div class="w-3 h-3 border-2 border-[#d32f2f] mr-1 rounded"></div> 上課日</div>
                </div>
            </div>

            <div class="wood-card p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fa-solid fa-book-bookmark mr-2"></i>教材使用紀錄</h2>
                <div class="space-y-4 mb-6">
                    <input type="text" id="newBookName" placeholder="教材名稱..." class="w-full border-b p-1 text-sm outline-none bg-transparent">
                    <div class="flex gap-2">
                        <input type="date" id="newBookStart" class="text-xs border rounded p-1 flex-1">
                        <button onclick="addBook()" class="bg-stone-700 text-white px-4 py-1 rounded text-sm whitespace-nowrap">新增教材</button>
                    </div>
                </div>
                <ul id="bookList" class="space-y-4">
                    </ul>
            </div>
        </div>
    </div>

    <div id="logModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalDate" class="text-lg font-bold mb-4 text-amber-900 underline">2025/01/01</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">今日練習時間 (分鐘)</label>
                    <input type="number" id="logMinutes" value="60" class="w-full border-b p-2 text-xl font-bold outline-none">
                </div>
                <div class="flex items-center py-2">
                    <input type="checkbox" id="logIsLesson" class="w-4 h-4 mr-2">
                    <span class="text-sm">今日有上老師的課</span>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">備註 (選填，如：練了哪一首)</label>
                    <input type="text" id="logNote" class="w-full border-b p-2 text-sm outline-none">
                </div>
                <button onclick="saveEntry()" class="w-full bg-amber-900 text-white py-3 rounded-lg mt-4 shadow-lg hover:bg-amber-800 transition">確認儲存</button>
                <button id="deleteBtn" onclick="deleteEntry()" class="w-full text-red-500 text-xs mt-4 hidden">刪除此日紀錄</button>
            </div>
        </div>
    </div>

    <script>
        // 數據結構更新：logs 只記時間，books 記日期
        let db = JSON.parse(localStorage.getItem('celloPureLogDB')) || {
            logs: {}, // "2025-01-01": { mins: 60, isLesson: true, note: "" }
            books: [] // { name: "Suzuki 1", start: "2025-01-01", end: null }
        };

        let currentViewDate = new Date(2025, 0, 1);
        let selectedDateStr = "";

        function renderCalendar() {
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const calendarBody = document.getElementById('calendarBody');
            calendarBody.innerHTML = '';

            for (let i = 0; i < firstDay; i++) calendarBody.innerHTML += '<div></div>';

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const log = db.logs[dateStr];
                
                let classes = "day-cell";
                if (log) classes += " day-active";
                if (log && log.isLesson) classes += " day-lesson";

                const dayEl = document.createElement('div');
                dayEl.className = classes;
                dayEl.innerHTML = `<span>${d}</span>${log ? `<span class="text-[8px] opacity-80">${log.mins}m</span>` : ''}`;
                dayEl.onclick = () => openModal(dateStr);
                calendarBody.appendChild(dayEl);
            }
            updateStats();
        }

        function changeMonth(step) {
            currentViewDate.setMonth(currentViewDate.getMonth() + step);
            renderCalendar();
        }

        function updateStats() {
            let totalMins = 0;
            let lessonCount = 0;
            
            Object.values(db.logs).forEach(entry => {
                totalMins += entry.mins;
                if (entry.isLesson) lessonCount++;
            });

            document.getElementById('statTotalHours').innerText = (totalMins / 60).toFixed(1) + 'h';
            document.getElementById('statTotalLessons').innerText = lessonCount;

            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';
            db.books.forEach((book, index) => {
                bookList.innerHTML += `
                    <li class="p-3 bg-stone-50 rounded-lg border border-stone-200">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-amber-900">${book.name}</span>
                            <button onclick="deleteBook(${index})" class="text-xs text-gray-400 hover:text-red-500">刪除</button>
                        </div>
                        <div class="text-[10px] text-gray-500 flex flex-col">
                            <span>開始：${book.start || '未設定'}</span>
                            <div class="flex items-center gap-2 mt-1">
                                <span>結束：${book.end || '學習中...'}</span>
                                ${!book.end ? `<button onclick="finishBook(${index})" class="text-[10px] bg-white border px-1 rounded">完成教材</button>` : ''}
                            </div>
                        </div>
                    </li>
                `;
            });
        }

        // 教材功能
        function addBook() {
            const name = document.getElementById('newBookName').value.trim();
            const start = document.getElementById('newBookStart').value;
            if (name) {
                db.books.push({ name, start, end: null });
                document.getElementById('newBookName').value = '';
                saveDB();
                updateStats();
            }
        }

        function finishBook(index) {
            const today = new Date().toISOString().split('T')[0];
            db.books[index].end = today;
            saveDB();
            updateStats();
        }

        function deleteBook(index) {
            if (confirm("確定要刪除這本教材紀錄嗎？")) {
                db.books.splice(index, 1);
                saveDB();
                updateStats();
            }
        }

        // 打卡功能
        function openModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDate').innerText = dateStr;
            const log = db.logs[dateStr];
            
            if (log) {
                document.getElementById('logMinutes').value = log.mins;
                document.getElementById('logIsLesson').checked = log.isLesson;
                document.getElementById('logNote').value = log.note || "";
                document.getElementById('deleteBtn').classList.remove('hidden');
            } else {
                document.getElementById('logMinutes').value = 60;
                document.getElementById('logIsLesson').checked = false;
                document.getElementById('logNote').value = "";
                document.getElementById('deleteBtn').classList.add('hidden');
            }
            document.getElementById('logModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('logModal').style.display = 'none'; }

        function saveEntry() {
            db.logs[selectedDateStr] = {
                mins: parseInt(document.getElementById('logMinutes').value) || 0,
                isLesson: document.getElementById('logIsLesson').checked,
                note: document.getElementById('logNote').value
            };
            saveDB();
            closeModal();
            renderCalendar();
        }

        function deleteEntry() {
            if (confirm("刪除這天的練琴紀錄？")) {
                delete db.logs[selectedDateStr];
                saveDB();
                closeModal();
                renderCalendar();
            }
        }

        function saveDB() { localStorage.setItem('celloPureLogDB', JSON.stringify(db)); }

        renderCalendar();
    </script>
</body>
</html>
