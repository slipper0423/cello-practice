<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的大提琴紀錄 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #fdfaf5; color: #4a3728; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee5d8; font-size: 0.8rem; background: white; }
        .day-cell:hover { background-color: #f3e5d0; }
        .day-active { background-color: #8b4513 !important; color: white; }
        .day-lesson { border: 2px solid #d32f2f !important; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .wood-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(61,43,31,0.1); border: 1px solid #e0d5c1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto pb-20">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">2025 總累積時數</div>
                <div id="statTotalHours" class="text-3xl font-bold text-amber-900">0.0h</div>
            </div>
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">累積上課次數</div>
                <div id="statTotalLessons" class="text-3xl font-bold text-red-700">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 wood-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendarTitle" class="text-xl font-bold">2025年 1月</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid mb-2 text-center text-xs text-gray-400 font-bold">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendarBody" class="calendar-grid"></div>
            </div>

            <div class="wood-card p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fa-solid fa-book-bookmark mr-2"></i>教材使用紀錄</h2>
                <div class="space-y-3 mb-6">
                    <input type="text" id="newBookName" placeholder="教材名稱..." class="w-full border-b p-1 text-sm outline-none bg-transparent">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] text-gray-400">開始日期</label>
                        <input type="date" id="newBookStart" class="text-xs border rounded p-1">
                        <button onclick="addBook()" class="bg-stone-700 text-white px-4 py-2 rounded text-sm mt-1 hover:bg-stone-600 transition">新增教材</button>
                    </div>
                </div>
                <ul id="bookList" class="space-y-4"></ul>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-2 gap-4">
            <button onclick="exportData()" class="border border-amber-900 text-amber-900 py-2 rounded-lg text-sm hover:bg-amber-50 transition">
                <i class="fa-solid fa-download mr-1"></i> 匯出備份 (同步到手機)
            </button>
            <div class="relative">
                <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                <button onclick="document.getElementById('importFile').click()" class="w-full border border-gray-400 text-gray-600 py-2 rounded-lg text-sm hover:bg-gray-50 transition">
                    <i class="fa-solid fa-upload mr-1"></i> 匯入備份 (接收電腦資料)
                </button>
            </div>
        </div>
    </div>

    <div id="logModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalDate" class="text-lg font-bold mb-4 text-amber-900 underline">日期</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">練習分鐘</label>
                    <input type="number" id="logMinutes" value="60" class="w-full border-b p-2 text-xl font-bold outline-none">
                </div>
                <div class="flex items-center"><input type="checkbox" id="logIsLesson" class="mr-2"> <span class="text-sm">今日有上課</span></div>
                <button onclick="saveEntry()" class="w-full bg-amber-900 text-white py-3 rounded-lg shadow-lg">儲存</button>
                <button id="deleteBtn" onclick="deleteEntry()" class="w-full text-red-500 text-xs mt-2 hidden">刪除紀錄</button>
            </div>
        </div>
    </div>

    <div id="bookEndModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <h3 class="text-lg font-bold mb-4">這本何時練完？</h3>
            <input type="date" id="finishDateInput" class="w-full border p-2 mb-4 rounded">
            <div class="flex gap-2">
                <button onclick="confirmFinishBook()" class="flex-1 bg-stone-700 text-white py-2 rounded">確定</button>
                <button onclick="closeBookModal()" class="flex-1 border py-2 rounded">取消</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('celloPureLogDB')) || { logs: {}, books: [] };
        let currentViewDate = new Date(2025, 0, 1);
        let selectedDateStr = "";
        let pendingBookIndex = null;

        function renderCalendar() {
            const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
            document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            const body = document.getElementById('calendarBody');
            body.innerHTML = '';
            for (let i = 0; i < firstDay; i++) body.innerHTML += '<div></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const log = db.logs[dateStr];
                const dayEl = document.createElement('div');
                dayEl.className = `day-cell ${log ? 'day-active' : ''} ${log?.isLesson ? 'day-lesson' : ''}`;
                dayEl.innerHTML = `<span>${d}</span>${log ? `<span class="text-[8px] opacity-80">${log.mins}m</span>` : ''}`;
                dayEl.onclick = () => openModal(dateStr);
                body.appendChild(dayEl);
            }
            updateStats();
        }

        function updateStats() {
            let mins = 0, lessons = 0;
            Object.values(db.logs).forEach(e => { mins += e.mins; if (e.isLesson) lessons++; });
            document.getElementById('statTotalHours').innerText = (mins / 60).toFixed(1) + 'h';
            document.getElementById('statTotalLessons').innerText = lessons;
            const list = document.getElementById('bookList');
            list.innerHTML = '';
            db.books.forEach((b, i) => {
                list.innerHTML += `<li class="p-3 bg-stone-50 rounded-lg border border-stone-200 shadow-sm">
                    <div class="flex justify-between font-bold text-amber-900"><span>${b.name}</span><button onclick="deleteBook(${i})" class="text-xs text-gray-400 hover:text-red-500">刪除</button></div>
                    <div class="text-[10px] text-gray-500 mt-1">開始：${b.start || '無'}<br>結束：${b.end || '學習中'}
                    ${!b.end ? `<button onclick="showBookModal(${i})" class="ml-2 text-stone-600 underline font-bold">設定完練</button>` : ''}</div>
                </li>`;
            });
        }

        // 同步功能邏輯
        function exportData() {
            const dataStr = JSON.stringify(db);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'cello_practice_backup.json';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedDB = JSON.parse(e.target.result);
                    if (confirm("匯入將覆蓋目前這台裝置的紀錄，確定嗎？")) {
                        db = importedDB;
                        saveDB();
                        renderCalendar();
                    }
                } catch (err) {
                    alert("檔案格式不正確！");
                }
            };
            reader.readAsText(file);
        }

        // 基本功能邏輯 (教材與打卡)
        function showBookModal(i) { pendingBookIndex = i; document.getElementById('bookEndModal').style.display = 'flex'; }
        function closeBookModal() { document.getElementById('bookEndModal').style.display = 'none'; }
        function confirmFinishBook() {
            const date = document.getElementById('finishDateInput').value;
            if (date) { db.books[pendingBookIndex].end = date; saveDB(); updateStats(); closeBookModal(); }
        }
        function addBook() {
            const name = document.getElementById('newBookName').value, start = document.getElementById('newBookStart').value;
            if (name) { db.books.push({ name, start, end: null }); saveDB(); updateStats(); document.getElementById('newBookName').value = ''; }
        }
        function deleteBook(i) { if (confirm("刪除教材？")) { db.books.splice(i, 1); saveDB(); updateStats(); } }
        function openModal(d) {
            selectedDateStr = d; document.getElementById('modalDate').innerText = d;
            const log = db.logs[d];
            document.getElementById('logMinutes').value = log ? log.mins : 60;
            document.getElementById('logIsLesson').checked = log ? log.isLesson : false;
            document.getElementById('deleteBtn').classList.toggle('hidden', !log);
            document.getElementById('logModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('logModal').style.display = 'none'; }
        function saveEntry() {
            db.logs[selectedDateStr] = { mins: parseInt(document.getElementById('logMinutes').value) || 0, isLesson: document.getElementById('logIsLesson').checked };
            saveDB(); closeModal(); renderCalendar();
        }
        function deleteEntry() { delete db.logs[selectedDateStr]; saveDB(); closeModal(); renderCalendar(); }
        function saveDB() { localStorage.setItem('celloPureLogDB', JSON.stringify(db)); }
        function changeMonth(s) { currentViewDate.setMonth(currentViewDate.getMonth() + s); renderCalendar(); }
        renderCalendar();
    </script>
</body>
</html>
