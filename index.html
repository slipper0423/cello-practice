<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的大提琴紀錄 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #fdfaf5; color: #4a3728; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #eee5d8; font-size: 0.8rem; background: white; }
        .day-cell:hover { background-color: #f3e5d0; }
        .day-active { background-color: #8b4513 !important; color: white; }
        .day-lesson { border: 2px solid #d32f2f !important; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .wood-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(61,43,31,0.1); border: 1px solid #e0d5c1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto pb-20">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">2025 總累積時數</div>
                <div id="statTotalHours" class="text-3xl font-bold text-amber-900">0.0h</div>
            </div>
            <div class="wood-card p-6 text-center">
                <div class="text-gray-500 text-sm">累積上課次數</div>
                <div id="statTotalLessons" class="text-3xl font-bold text-amber-900">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 wood-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendarTitle" class="text-xl font-bold">2025年 1月</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid mb-2 text-center text-xs text-gray-400 font-bold">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendarBody" class="calendar-grid"></div>
            </div>

            <div class="wood-card p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold"><i class="fa-solid fa-book-bookmark mr-2"></i>教材使用</h2>
                    <button id="toggleBookListBtn" onclick="toggleBookList()" class="text-[11px] text-stone-500 hover:text-stone-800 transition hidden">展開全部</button>
                </div>
                
                <div class="space-y-3 mb-6">
                    <input type="text" id="newBookName" placeholder="教材名稱..." class="w-full border-b p-1 text-sm outline-none bg-transparent">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] text-gray-400">預設新增日期</label>
                        <input type="date" id="newBookStart" class="text-xs border rounded p-1">
                        <button onclick="addBook()" class="bg-stone-700 text-white px-4 py-2 rounded text-sm mt-1 hover:bg-stone-600 transition font-bold">新增教材</button>
                    </div>
                </div>
                
                <ul id="bookList" class="space-y-3"></ul>
            </div>
        </div>

        <div class="mt-8 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="exportData()" class="border border-amber-900 text-amber-900 py-2 rounded-lg text-sm hover:bg-amber-50 transition font-bold">
                    <i class="fa-solid fa-download mr-1"></i> 匯出備份
                </button>
                <div class="relative">
                    <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                    <button onclick="document.getElementById('importFile').click()" class="w-full border border-gray-400 text-gray-600 py-2 rounded-lg text-sm hover:bg-gray-50 transition font-bold">
                        <i class="fa-solid fa-upload mr-1"></i> 匯入備份
                    </button>
                </div>
            </div>
            <button onclick="resetAllData()" class="w-full border border-red-200 text-red-400 py-2 rounded-lg text-xs hover:bg-red-50 transition font-bold">
                <i class="fa-solid fa-trash-can mr-1"></i> 清空所有紀錄
            </button>
        </div>
    </div>

    <div id="bookDateModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <h3 id="dateModalTitle" class="text-lg font-bold mb-4 text-amber-900">設定日期</h3>
            <input type="date" id="dateModalInput" class="w-full border p-2 mb-4 rounded">
            <div class="flex gap-2">
                <button onclick="confirmBookDate()" class="flex-1 bg-stone-700 text-white py-2 rounded font-bold">確定</button>
                <button onclick="closeBookDateModal()" class="flex-1 border py-2 rounded font-bold">取消</button>
            </div>
        </div>
    </div>

    <div id="logModal" class="modal">
        <div class="wood-card p-8 w-80 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalDate" class="text-lg font-bold mb-4 text-amber-900 underline">日期</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">練習分鐘</label>
                    <input type="number" id="logMinutes" value="60" class="w-full border-b p-2 text-xl font-bold outline-none">
                </div>
                <div class="flex items-center"><input type="checkbox" id="logIsLesson" class="mr-2"> <span class="text-sm">今日有上課</span></div>
                <button onclick="saveEntry()" class="w-full bg-amber-900 text-white py-3 rounded-lg shadow-lg font-bold">儲存</button>
                <button id="deleteBtn" onclick="deleteEntry()" class="w-full text-red-500 text-xs mt-2 hidden">刪除紀錄</button>
            </div>
        </div>
    </div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('newBookStart').value = todayStr;

        let db = JSON.parse(localStorage.getItem('celloPureLogDB')) || { logs: {}, books: [] };
        let currentViewDate = new Date(2025, 0, 1);
        let selectedDateStr = "";
        let pendingBookIndex = null;
        let dateMode = ""; 
        let isBookListExpanded = false; // 控制列表展開狀態

        function updateStats() {
            let mins = 0, lessons = 0;
            Object.values(db.logs).forEach(e => { mins += e.mins; if (e.isLesson) lessons++; });
            document.getElementById('statTotalHours').innerText = (mins / 60).toFixed(1) + 'h';
            document.getElementById('statTotalLessons').innerText = lessons;

            const list = document.getElementById('bookList');
            const toggleBtn = document.getElementById('toggleBookListBtn');
            list.innerHTML = '';

            // 判斷是否需要顯示切換按鈕
            if (db.books.length > 3) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.innerText = isBookListExpanded ? "收起列表" : "展開全部";
            } else {
                toggleBtn.classList.add('hidden');
                isBookListExpanded = true; 
            }

            // 根據狀態決定渲染多少教材
            const booksToShow = isBookListExpanded ? db.books : db.books.slice(0, 3);

            booksToShow.forEach((b, i) => {
                const actualIndex = i; // 這裡簡化處理，如需配合刪除請使用原始 ID
                list.innerHTML += `<li class="p-3 bg-stone-50 rounded-lg border border-stone-200">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[13px] font-bold text-amber-900 leading-tight">${b.name}</span>
                        <button onclick="deleteBook(${i})" class="text-[11px] text-gray-400 hover:text-red-500 transition ml-2 whitespace-nowrap">刪除</button>
                    </div>
                    <div class="text-[12px] text-gray-600">
                        開始：${b.start || '無'} <button onclick="openDateModal(${i}, 'start')" class="ml-1 text-stone-400 underline italic">修改</button><br>
                        結束：${b.end || '學習中'}
                        ${!b.end ? `<button onclick="openDateModal(${i}, 'end')" class="ml-1 text-stone-600 underline font-bold">設定完練</button>` : `<button onclick="openDateModal(${i}, 'end')" class="ml-1 text-stone-400 underline italic">修改</button>`}
                    </div>
                </li>`;
            });
        }

        function toggleBookList() {
            isBookListExpanded = !isBookListExpanded;
            updateStats();
        }

        // --- 其他原有功能函數 (保持不變) ---
        function renderCalendar() {
            const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
            document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            const body = document.getElementById('calendarBody');
            body.innerHTML = '';
            for (let i = 0; i < firstDay; i++) body.innerHTML += '<div></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const log = db.logs[dateStr];
                const dayEl = document.createElement('div');
                dayEl.className = `day-cell ${log ? 'day-active' : ''} ${log?.isLesson ? 'day-lesson' : ''}`;
                dayEl.innerHTML = `<span>${d}</span>${log ? `<span class="text-[8px] opacity-80">${log.mins}m</span>` : ''}`;
                dayEl.onclick = () => openModal(dateStr);
                body.appendChild(dayEl);
            }
            updateStats();
        }

        function openDateModal(i, mode) {
            pendingBookIndex = i; dateMode = mode;
            document.getElementById('dateModalTitle').innerText = mode === 'start' ? "設定開始日期" : "設定完練日期";
            document.getElementById('dateModalInput').value = mode === 'start' ? (db.books[i].start || todayStr) : (db.books[i].end || todayStr);
            document.getElementById('bookDateModal').style.display = 'flex';
        }
        function closeBookDateModal() { document.getElementById('bookDateModal').style.display = 'none'; }
        function confirmBookDate() {
            const date = document.getElementById('dateModalInput').value;
            if (date) {
                if (dateMode === 'start') db.books[pendingBookIndex].start = date;
                else db.books[pendingBookIndex].end = date;
                saveDB(); updateStats(); closeBookDateModal();
            }
        }
        function addBook() {
            const name = document.getElementById('newBookName').value, start = document.getElementById('newBookStart').value;
            if (name) { 
                db.books.unshift({ name, start, end: null }); // 新增的排在最前面
                saveDB(); updateStats(); document.getElementById('newBookName').value = ''; 
            }
        }
        function deleteBook(i) { if (confirm("刪除教材？")) { db.books.splice(i, 1); saveDB(); updateStats(); } }
        function saveDB() { localStorage.setItem('celloPureLogDB', JSON.stringify(db)); }
        function openModal(d) {
            selectedDateStr = d; document.getElementById('modalDate').innerText = d;
            const log = db.logs[d];
            document.getElementById('logMinutes').value = log ? log.mins : 60;
            document.getElementById('logIsLesson').checked = log ? log.isLesson : false;
            document.getElementById('deleteBtn').classList.toggle('hidden', !log);
            document.getElementById('logModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('logModal').style.display = 'none'; }
        function saveEntry() {
            db.logs[selectedDateStr] = { mins: parseInt(document.getElementById('logMinutes').value) || 0, isLesson: document.getElementById('logIsLesson').checked };
            saveDB(); closeModal(); renderCalendar();
        }
        function deleteEntry() { delete db.logs[selectedDateStr]; saveDB(); closeModal(); renderCalendar(); }
        function changeMonth(s) { currentViewDate.setMonth(currentViewDate.getMonth() + s); renderCalendar(); }
        function exportData() {
            const dataStr = JSON.stringify(db);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'cello_practice_backup.json');
            linkElement.click();
        }
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    db = JSON.parse(e.target.result); saveDB(); renderCalendar();
                } catch (err) { alert("格式錯誤"); }
            };
            reader.readAsText(file);
        }
        function resetAllData() { if (confirm("確定清空？")) { db = { logs: {}, books: [] }; saveDB(); renderCalendar(); } }

        renderCalendar();
    </script>
</body>
</html>
